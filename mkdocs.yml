site_name: Evolve
site_description: 免费AI模型指南、技术报告与工具配置教程 - 帮助你快速找到可用的免费大语言模型
site_url: https://evolve.liveppp.com
repo_url: https://github.com/RichLiao1112/evolve
repo_name: RichLiao1112
copyright: Copyright © 2026 RichLiao1112

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RichLiao1112
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # 替换为你的 GA4 ID
  meta:
    - property: og:type
      content: website
    - property: og:site_name
      content: Evolve
    - property: og:locale
      content: zh_CN
    - name: twitter:card
      content: summary_large_image
    - name: author
      content: RichLiao1112

theme:
  name: material
  custom_dir: overrides
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - social:
      cards: true
      cards_layout_options:
        background_color: "#1976d2"
        font_family: "Noto Sans SC"

nav:
  - Hermes:
      - 总览: hermes-config.md
      - 命令速查: hermes/command-cheatsheet.md
      - 提速配置: hermes/performance.md
      - Provider / 凭证配置: hermes/providers-and-credentials.md
      - Gateway 配置: hermes/gateway.md
      - 平台接入与消息入口: hermes/platform-integrations.md
      - Tools 与 MCP 配置: hermes/tools-and-mcp.md
      - Profiles / 多实例管理: hermes/profiles.md
      - 配置文件与维护: hermes/config-files-and-maintenance.md
      - 常见故障排查: hermes/troubleshooting.md
  - 免费模型:
      - 总览: free-models/index.md
      - Elephant Alpha - 免费模型 - 2026-04-13: free-models/elephant-alpha.md
      - NVIDIA Nemotron 3 Super 120B A12B - 免费模型 - 2026-03-11: free-models/nemotron-3-super-120b-a12b-free.md
      - NVIDIA Nemotron 3 Nano 30B A3B - 免费模型 - 2026-02: free-models/nemotron-3-nano-30b-a3b-free.md
      - Google Gemma 4 31B Instruct - 免费模型 - 2026-04-02: free-models/gemma-4-31b-it-free.md
      - Google Gemma 4 26B A4B - 免费模型 - 2026-04-03: free-models/gemma-4-26b-a4b-it-free.md
      - Qwen3 Coder 480B - 免费模型 - 2026-04: free-models/qwen3-coder-480b-free.md
      - MiniMax M2.5 - 免费模型 - 2026-03: free-models/minimax-m2.5-free.md
      - Meta Llama 3.3 70B - 免费模型 - 2025-12: free-models/llama-3.3-70b-instruct-free.md
      - OpenAI GPT-OSS 120B - 免费模型 - 2026-03: free-models/gpt-oss-120b-free.md
      - OpenAI GPT-OSS 20B - 免费模型 - 2026-03: free-models/gpt-oss-20b-free.md
  - 工具:
      - 总览: tools/index.md
      - MarkItDown：把 PDF / Word / PPT / Excel 转成 Markdown 的轻量工具: tools/markitdown-guide.md
  - 报告:
      - 别再给 Agent 发工牌了: reports/multi-agent-virtual-company-fallacy.md
      - Open Agents 技术架构总结: reports/open-agents-architecture-summary.md
      - reports/hermes-agent-self-evolution.md
      - reports/ai-site-optimization-loop.md
  - 站点信息:
      - 关于: site-info/about.md
      - 隐私政策: site-info/privacy-policy.md
      - 联系方式: site-info/contact.md
      - 免责声明: site-info/disclaimer.md
