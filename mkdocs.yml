site_name: Evolve
site_description: Public share site for reports, summaries, and technical notes
site_url: https://evolve.liveppp.com
repo_name: RichLiao1112/evolve
repo_url: https://github.com/RichLiao1112/evolve
copyright: Copyright © 2026 RichLiao1112

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - 首页: index.md
  - 报告:
      - Hermes Agent Self-Evolution: reports/hermes-agent-self-evolution.md
      - AI 持续优化网站闭环方案: reports/ai-site-optimization-loop.md
