site_name: Evolve
site_description: Public share site for reports, summaries, and technical notes
site_url: https://evolve.liveppp.com
repo_url: https://github.com/RichLiao1112/evolve
repo_name: RichLiao1112
copyright: Copyright © 2026 RichLiao1112

theme:
  name: material
  custom_dir: overrides
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: indigo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Hermes:
      - 总览: hermes-config.md
      - 命令速查: hermes/command-cheatsheet.md
      - 提速配置: hermes/performance.md
      - Provider / 凭证配置: hermes/providers-and-credentials.md
      - Gateway 配置: hermes/gateway.md
      - 平台接入与消息入口: hermes/platform-integrations.md
      - Tools 与 MCP 配置: hermes/tools-and-mcp.md
      - Profiles / 多实例管理: hermes/profiles.md
      - 配置文件与维护: hermes/config-files-and-maintenance.md
      - 常见故障排查: hermes/troubleshooting.md
  - 免费模型:
      - 总览: free-models/index.md
      - Elephant Alpha - 免费模型 - 2026-04-13: free-models/elephant-alpha.md
      - NVIDIA Nemotron 3 Super 120B A12B - 免费模型 - 2026-03-11: free-models/nemotron-3-super-120b-a12b-free.md
  - 报告:
      - Open Agents 技术架构总结: reports/open-agents-architecture-summary.md
      - reports/hermes-agent-self-evolution.md
      - reports/ai-site-optimization-loop.md
  - 站点信息:
      - 关于: site-info/about.md
      - 隐私政策: site-info/privacy-policy.md
      - 联系方式: site-info/contact.md
      - 免责声明: site-info/disclaimer.md
